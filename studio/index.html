<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lecture Studio</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2030; --muted: #6b7083; --line: #e3e1da;
    --accent: #c77700; --ok: #1f8a70; --warn: #b4442f; --chip: #efede6; --code: #f0efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1220; --panel: #171b2e; --ink: #ecebe6; --muted: #9298b0; --line: #2a3150;
      --accent: #ffb547; --ok: #4fd1a5; --warn: #ff7b6b; --chip: #222843; --code: #11152a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 56px); }
  aside { border-right: 1px solid var(--line); padding: 16px; }
  main { padding: 20px 24px 80px; max-width: 1100px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 18px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  textarea { resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lec { display: block; width: 100%; text-align: left; margin: 4px 0; }
  .lec.active { border-color: var(--accent); }
  .lecrow { display: flex; gap: 4px; align-items: stretch; }
  .lecrow .lec { flex: 1; min-width: 0; }
  .lecdel { margin: 4px 0; padding: 0 9px; color: var(--muted); }
  .lecdel:hover { color: #c62828; border-color: #c62828; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .step { padding: 6px 10px; border-radius: 999px; background: var(--chip); font-size: 13px; cursor: pointer; border: 1px solid transparent; }
  .step.active { border-color: var(--accent); }
  .step .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .step.approved .dot { background: var(--ok); }
  .step.stale .dot, .step.editing .dot { background: var(--warn); }
  pre { background: var(--code); border-radius: 8px; padding: 12px; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; font-size: 13px; margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 4px; vertical-align: top; text-align: left; font-size: 14px; }
  .scene { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gate { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 12px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .badge.approved { background: var(--ok); color: #fff; }
  .badge.stale, .badge.editing { background: var(--warn); color: #fff; }
  .badge.qawarn { background: var(--accent); color: #111; }
  #job { position: fixed; right: 16px; bottom: 16px; width: min(560px, calc(100vw - 32px)); display: none; }
  #job pre { max-height: 260px; margin-top: 6px; }
  .pbar { height: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; margin: 8px 0 4px; position: relative; }
  .pbar > div { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
  .pbar.indet > div { width: 30% !important; position: absolute; animation: indet 1.4s ease-in-out infinite; }
  .pbar.done > div { background: var(--ok); }
  .pbar.fail > div { background: var(--warn); }
  @keyframes indet { 0% { left: -30%; } 100% { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .pbar.indet > div { animation: none; left: 35%; opacity: .6; } }
  #toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; display: none; z-index: 10; }
  img.snap { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  video { width: 100%; border-radius: 8px; background: #000; }
  .styles { display: grid; gap: 8px; }
  .style { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 10px 12px; }
  .style.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .warnbox { background: var(--chip); border-left: 3px solid var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 8px 0; }
  .warnbox summary { cursor: pointer; font-weight: 700; }
  .sttdiff { font-size: 12px; margin-top: 4px; } .sttdiff s { color: var(--muted); }
  .warnbox ul { margin: 6px 0 0; padding-left: 18px; }
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .refbox { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 10px; }
  .refbox summary { cursor: pointer; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
  .gallery figure { margin: 0; background: repeating-conic-gradient(var(--chip) 0 25%, var(--panel) 0 50%) 0 0 / 16px 16px;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .gallery img { width: 100%; height: 120px; object-fit: contain; display: block; }
  .gallery figcaption { font-size: 11px; color: var(--muted); word-break: break-all; display: flex; justify-content: space-between; gap: 4px; align-items: center; }
  .importbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; background: var(--bg); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table.plan { min-width: 760px; }
  table.plan th, table.plan td { padding: 6px; vertical-align: top; }
  table.plan tr:first-child th { background: var(--chip); font-size: 12px; color: var(--muted); white-space: nowrap; }
  table.plan .rowhead { width: 170px; font-weight: 400; font-size: 13px; }
  table.plan .say { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  table.plan input, table.plan select, table.plan textarea { font-size: 13px; padding: 4px 6px; }
  table.plan textarea { min-width: 150px; line-height: 1.4; }
  table.plan tr.changed > th.rowhead { box-shadow: inset 3px 0 0 var(--accent); }
  .userset { font-weight: 700; border-color: var(--accent) !important; }
  .userset::before { content: ""; }
  b.legend.userset { color: var(--accent); }
  .legend.changed { border-left: 3px solid var(--accent); padding-left: 4px; }
  button.mini { padding: 3px 8px; font-size: 13px; }
  .promptbox { margin: 12px 0; }
  .promptbox summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .promptbox pre { max-height: 260px; margin-top: 6px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--chip); }
  .count { font-size: 12px; color: var(--muted); }
  .count.over { color: var(--warn); }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header><h1>Lecture Studio</h1><span class="sub">문서 → 진행자 없는 애니메이션 영상 · 단계마다 사람이 승인</span></header>
<div class="layout">
  <aside>
    <h3 style="margin-top:0">프로젝트</h3>
    <div id="lectures"></div>
    <div class="card">
      <label>새 프로젝트 이름 (영문/한글, 공백 없이)</label>
      <input id="newSlug" placeholder="my-first-project" />
      <label>제목</label>
      <input id="newTitle" placeholder="예: 3분 만에 이해하는 핵심 개념" />
      <div class="row" style="margin-top:8px"><button class="primary" onclick="createLecture()">만들기</button></div>
    </div>
    <details class="card"><summary>이 PC 설정</summary>
      <label>qwen-tts Python</label><input id="cfg_qwen_python" />
      <label>기본 나레이션 백엔드</label>
      <select id="cfg_narrate_backend" onchange="setDefault({narrate_backend:this.value})"><option value="customvoice">customvoice — Qwen 기본 화자</option><option value="clone">clone — Qwen 내 목소리 (로컬·무료)</option><option value="fish">fish — Fish Audio 내 목소리 (유료 크레딧)</option><option value="silent">silent — 길이만 (시험용)</option></select>
      <label>기본 화자 (customvoice · 바로 적용)</label><select id="cfg_speaker" onchange="setDefault({speaker:this.value})"></select>
      <label>내 목소리 프로필 (clone)</label><input id="cfg_voice" />
      <label>Claude Code 명령</label><input id="cfg_claude_cmd" />
      <label>이미지 생성 Python (스토리 캐릭터, 로컬 FLUX)</label><input id="cfg_image_python" />
      <label>다시 듣기 검사 Python (faster-whisper 가 설치된 것, 예: qwen-tts venv)</label><input id="cfg_stt_python" />
      <label>다시 듣기 엔진 · 모델</label><div class="row"><select id="cfg_stt_engine" style="flex:1"><option value="auto">auto — faster-whisper, 없으면 whisper.cpp(npx)</option><option value="faster-whisper">faster-whisper</option><option value="hyperframes">whisper.cpp (npx hyperframes transcribe)</option></select>
        <select id="cfg_stt_model" style="width:140px"><option>small</option><option>medium</option><option>large-v3</option><option>base</option></select></div>
      <div class="row" style="margin-top:8px"><button onclick="saveConfig()">저장</button></div>
      <p class="muted">studio/config.local.json 에 저장 (git 제외, 맥북에서는 따로 설정)</p>
    </details>
  </aside>
  <main id="main"><p class="muted">불러오는 중…</p></main>
</div>
<div id="job" class="card"><div class="row" style="justify-content:space-between"><b id="jobTitle"></b><button onclick="hideJob()">닫기</button></div>
  <div id="jobStage" class="muted"></div>
  <div class="pbar"><div id="jobBar"></div></div>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><span id="jobLabel" class="muted"></span><b id="jobPct"></b></div>
  <details><summary class="muted">로그 보기</summary><pre id="jobLog"></pre></details></div>
<div id="toast"></div>

<script>
const LABEL = { source: "1 원문", brief: "2 기획", script: "3 대본", narration: "4 나레이션", visuals: "5 장면", render: "6 렌더", publish: "7 게시" };
const SHAPES = ["transform", "cycle", "checklist-terminal", "stack", "axis", "converge", "source-figure"];
// Qwen3-TTS CustomVoice built-in speakers. Only sohee is Korean-native; the male voices read Korean with an accent.
const SPEAKERS = [
  ["uncle_fu", "남성 · 낮고 차분함 (중국어 원어민)"], ["ryan", "남성 · 힘 있고 리드미컬 (영어 원어민)"],
  ["aiden", "남성 · 밝은 미국식 (영어 원어민)"], ["dylan", "남성 · 베이징 (중국어)"], ["eric", "남성 · 청두 (중국어)"],
  ["sohee", "여성 · 따뜻함 (한국어 원어민)"], ["serena", "여성 · 부드러움 (중국어)"], ["vivian", "여성 · 밝음 (중국어)"],
  ["ono_anna", "여성 · 경쾌함 (일본어)"],
];
const speakerOptions = (sel) => SPEAKERS.map(([v, d]) => `<option value="${v}" ${v === sel ? "selected" : ""}>${v} — ${d}</option>`).join("");
let CONFIG = {};
let cur = null, view = null, stage = "source", pollTimer = null, review = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => (t.style.display = "none"), 2600); }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { toast(j.error || "오류"); throw new Error(j.error); }
  return j;
}

async function loadList() {
  const j = await api("/api/lectures");
  $("lectures").innerHTML = j.lectures.map((l) =>
    `<div class="lecrow"><button class="lec ${l.slug === cur ? "active" : ""}" onclick="openLecture('${esc(l.slug)}')">${esc(l.title)}<br><span class="muted">${l.approved}/7 승인</span></button>` +
    `<button class="lecdel" title="프로젝트 삭제 (휴지통으로 이동)" onclick="deleteLecture('${esc(l.slug)}')">✕</button></div>`).join("") || '<p class="muted">아직 없음</p>';
  CONFIG = j.config;
  $("cfg_speaker").innerHTML = speakerOptions(j.config.speaker);
  for (const k of Object.keys(j.config)) if ($("cfg_" + k)) $("cfg_" + k).value = j.config[k];
  return j.lectures;
}
// Right pane is never blank: reopen the last lecture (or the first one) on load.
async function boot() {
  const list = await loadList();
  let last = null; try { last = localStorage.getItem("studio_last_lecture"); } catch (e) {}
  const pick = list.find((l) => l.slug === last) || list[0];
  if (pick) return openLecture(pick.slug);
  $("main").innerHTML = `<h2>Lecture Studio 시작하기</h2><div class="card">
    <p>문서 한 편을 진행자 없는 애니메이션 영상(강의·스토리·홍보)으로 만듭니다. 단계마다 사람이 확인하고 승인합니다.</p>
    <ol><li>왼쪽에서 <b>새 프로젝트</b>를 만듭니다.</li><li>원문 파일(PDF·HTML·Markdown)을 고릅니다.</li>
    <li>기획 → 대본 → 나레이션 → 장면 → 렌더 → 게시 순서로 검토·승인합니다.</li></ol></div>`;
}
async function setDefault(body) {
  CONFIG = await api("/api/config", body);
  toast(body.speaker ? `기본 화자: ${body.speaker} (모든 프로젝트에 적용)` : `나레이션 방식: ${body.narrate_backend}`);
  if (cur) await refresh();
}
async function saveConfig() {
  const body = {}; for (const k of ["qwen_python", "narrate_backend", "speaker", "voice", "claude_cmd", "image_python", "stt_python", "stt_engine", "stt_model"]) body[k] = $("cfg_" + k).value;
  await api("/api/config", body); toast("설정 저장됨");
}
async function createLecture() {
  const slug = $("newSlug").value.trim(); if (!slug) return toast("이름을 입력하세요");
  toast("프로젝트 만드는 중… (npm에서 폰트·GSAP 받는 데 수십 초)");
  await api("/api/lectures", { slug, title: $("newTitle").value.trim() || slug });
  await loadList(); openLecture(slug);
}
async function deleteLecture(slug) {
  if (!confirm(`프로젝트 "${slug}"를 삭제할까요?\n\n폴더 전체(원문·대본·나레이션·장면·렌더)가 휴지통으로 이동합니다.\nFinder 휴지통에서 되살릴 수 있습니다.`)) return;
  const r = await api(`/api/lectures/${encodeURIComponent(slug)}/delete`, {});
  toast("휴지통으로 이동했습니다");
  if (slug === cur) {
    cur = null; view = null;
    try { localStorage.removeItem("studio_last_lecture"); } catch (e) {}
    return boot();
  }
  loadList();
}
async function openLecture(slug) {
  if (slug !== cur) { styleDraft = null; planDraft = null; }
  cur = slug; view = await api(`/api/lectures/${encodeURIComponent(slug)}`);
  try { localStorage.setItem("studio_last_lecture", slug); } catch (e) {}
  if (!openLecture.keepStage) {
    const st = view.state.stages; stage = view.stages.find((s) => (st[s] || {}).status !== "approved") || "publish";
  }
  openLecture.keepStage = false;
  render(); loadList();
  if (view.running) watchJob(view.running.id, view.running.kind);
}
async function refresh() { openLecture.keepStage = true; await openLecture(cur); }

function status(s) { return (view.state.stages[s] || {}).status || "pending"; }
function gate(s, extra = "") {
  const st = view.state.stages[s] || {};
  const label = { approved: `승인됨 ${st.approved_at || ""}`, stale: "앞 단계가 바뀌어 다시 승인 필요", editing: "수정됨 — 다시 승인 필요", pending: "검토 대기" }[status(s)];
  return `<div class="gate"><span class="badge ${status(s)}">${label}</span><div class="row">${extra}<button class="ok" onclick="approve('${s}')">이 단계 승인 →</button></div></div>`;
}

function render() {
  const st = view.state;
  let h = `<h2>${esc(st.title)}</h2><div class="muted">lectures/${esc(st.slug)}</div><div class="steps">` +
    view.stages.map((s) => `<span class="step ${status(s)} ${s === stage ? "active" : ""}" onclick="stage='${s}';render()"><span class="dot"></span>${LABEL[s]}</span>`).join("") + "</div>";
  h += { source: pSource, brief: pBrief, script: pScript, narration: pNarration, visuals: pVisuals, render: pRender, publish: pPublish }[stage]();
  $("main").innerHTML = h;
  if (stage === "script") updateCounts();
}

/* 1 source */
function pSource() {
  const curName = (view.state.source || "").split("/").pop();
  return `<div class="card"><h3 style="margin-top:0">원문 고르기</h3>
    <p class="muted">컴퓨터의 아무 폴더에서 PDF·HTML·Markdown·텍스트 파일을 고르세요. 고르면 바로 텍스트를 추출합니다.</p>
    <div id="dropzone" class="drop" onclick="$('srcPick').click()" ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');uploadSource(event.dataTransfer.files[0])">
      <b>파일 선택</b> 또는 여기로 끌어다 놓기<br><span class="muted">현재 원문: ${curName ? esc(curName) : "없음"}</span></div>
    <input type="file" id="srcPick" accept=".pdf,.html,.htm,.md,.markdown,.txt" style="display:none" onchange="uploadSource(this.files[0])">
    <div class="row" style="margin-top:8px"><button onclick="refresh()">새로고침</button></div>
    <h3>추출 결과 미리보기</h3><pre>${esc(view.source_preview) || "아직 추출 전"}</pre>
    <p class="muted">확인할 것: 표·목록이 깨지지 않았는지, 빠진 페이지가 없는지.</p>${gate("source")}</div>`;
}

async function uploadSource(file) {
  if (!file) return;
  toast(`${file.name} 올리는 중…`);
  const r = await fetch(`/api/lectures/${encodeURIComponent(cur)}/upload_source`, {
    method: "POST", headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(file.name) }, body: file });
  const j = await r.json();
  if (!r.ok) return toast(j.error || "업로드 실패");
  watchJob(j.job, "extract");
}

/* 2 brief */
function pBrief() {
  const b = view.state.brief || {};
  const f = (k, label, ph, ta) => `<label>${label}</label>${ta ? `<textarea id="b_${k}" rows="2" placeholder="${ph}">${esc(b[k])}</textarea>` : `<input id="b_${k}" value="${esc(b[k])}" placeholder="${ph}">`}`;

function narrationBytes(ids) {

  return sc.reduce((n, s) => n + new TextEncoder().encode((s.narration || s.text || "").trim()).length, 0);
}
function fishOk(backend, ids) {
  if ((backend || CONFIG.narrate_backend) !== "fish") return true;
  if (!view.voice?.fish?.voice_id) { toast("Fish Audio 화자가 없습니다 — 아래 '내 목소리 화자'에서 먼저 만드세요"); return false; }
  const b = narrationBytes(ids);
  return confirm(`Fish Audio 로 나레이션을 만듭니다 (화자: ${view.voice?.fish?.title || "없음"}).\n\n` +
    `바뀐 장면만 생성 — 최대 약 ${b.toLocaleString()} 크레딧 (텍스트 ${b.toLocaleString()}바이트, 한글 1자 ≈ 3).\n잔액이 모자라면 생성하지 않고 멈춥니다. 진행할까요?`);
}
function narrate() {
  const backend = (view.config || CONFIG).narrate_backend, p = narrPlan();
  if (p && !p.pending.length) return toast("모두 최신 — 다시 만들 장면이 없습니다 ('다시' 표시 후 재생성은 가능)");
  if (!fishOk(backend, p ? p.pending.map((x) => x.id) : undefined)) return;
  act("narrate", { backend, paid_ok: true });
}
/* scenes worth another take: the listen-back check heard something else, or the take's length doesn't fit its text */
function narrFlagged() {
  const stt = view.stt && !view.stt.stale ? view.stt.flagged : [];
  const pending = narrPlan()?.byId || {};
  const warn = (view.audio?.scenes || []).filter((x) => x.file && x.warn && !pending[x.id]).map((x) => x.id);
  return [...new Set([...stt, ...warn])];
}
function redoScenes(ids) {
  if (!ids || !ids.length) return;
  const backend = (view.config || CONFIG).narrate_backend;
  if (!fishOk(backend, ids)) return;
  act("narrate", { backend, force: ids, paid_ok: true });
}

/* 5 visuals — pick a video style (one manifest per skill in studio/styles/), set its options, build */
let styleDraft = null;   // {id, options} while editing, before "저장"
const NARR = { sync: ["나레이션이 타이밍을 정함", "ok"], overlay: ["나레이션 얹기 가능", "ok"], none: ["나레이션 안 씀", ""] };
const styleById = (id) => view.styles.find((s) => s.id === id);
function selStyle() { return styleDraft || view.style; }
function pickStyle(id) {
  const s = styleById(id); if (!s) return;
  const keep = id === view.style.id ? view.style.options : {};
  styleDraft = { id, options: Object.fromEntries(s.options.map((o) => [o.key, keep[o.key] ?? o.default ?? ""])) };
  render();
}
function setOpt(k, v, rerender) { styleDraft = styleDraft || structuredClone(view.style); styleDraft.options[k] = v; if (rerender) render(); }
function optField(s, o, val) {
  if (o.show_if && Object.entries(o.show_if).some(([k, v]) => (selStyle().options[k] ?? "") !== v)) return "";
  const req = o.required ? ' <b style="color:var(--warn)">*</b>' : "";
  const help = o.help ? `<div class="muted">${esc(o.help)}</div>` : "";
  let input;
  if (o.type === "select") {
    input = `<select onchange="setOpt('${o.key}', this.value, true)">${(o.choices || []).map(([v, l]) =>
      `<option value="${esc(v)}" ${String(v) === String(val) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    if (o.preview && o.preview[val]) input += `<img class="snap" style="margin-top:6px;max-width:420px" src="/style-media/${esc(s.id)}/${esc(o.preview[val])}" alt="">`;
  } else if (o.type === "textarea") {
    input = `<textarea rows="3" oninput="setOpt('${o.key}', this.value)">${esc(val)}</textarea>`;
  } else if (o.type === "color") {
    input = `<div class="row"><input type="color" value="${esc(val)}" style="width:56px;padding:2px" oninput="setOpt('${o.key}', this.value);this.nextElementSibling.textContent=this.value"><code>${esc(val)}</code></div>`;
  } else {
    input = `<input value="${esc(val)}" oninput="setOpt('${o.key}', this.value)">`;
  }
  return `<div><label>${esc(o.label)}${req}</label>${input}${help}</div>`;
}
function styleCard(s, active) {
  const [nl, nc] = NARR[s.narration] || ["", ""];
  const flags = [s.error && `<span class="badge stale">${esc(s.error)}</span>`, s.engine === "skill" && !s.installed && '<span class="badge stale">스킬 파일 없음</span>',
    s.draft && '<span class="badge editing">기본 설정 — 분석 필요</span>', `<span class="badge ${nc === "ok" ? "approved" : ""}">${nl}</span>`].filter(Boolean).join(" ");
  return `<button class="style ${active ? "active" : ""}" onclick="pickStyle('${esc(s.id)}')" ${s.error ? "disabled" : ""}>
    <b>${esc(s.name)}</b><span class="muted">${esc(s.kind || "")}</span><span>${flags}</span></button>`;
}
let importOpen = false;  // "+ 스타일 추가" panel inside the style card
let planDraft = null;    // {rowId: {colKey: value}} — user-set cells only, before "구성 저장"
function planVals() { return planDraft || structuredClone(Object.fromEntries(view.plan.rows.map((r) => [r.id, r.values]))); }
function cellVal(r, k) { const v = planVals()[r.id] || {}; return k in v ? v[k] : r.defaults[k] ?? ""; }
function setCell(rid, k, v, rerender) {
  planDraft = planVals(); const r = view.plan.rows.find((x) => x.id === rid);
  const row = planDraft[rid] || (planDraft[rid] = {});
  if (v === (r.defaults[k] ?? "")) delete row[k]; else row[k] = v;
  if (rerender) render(); else markRow(rid);
}
function resetRow(rid) { planDraft = planVals(); delete planDraft[rid]; render(); }
function rowChanged(r) {   // differs from what the last build used
  const b = view.plan.built_rows?.[r.id]; if (!b) return false;
  const now = { ...r.defaults, ...(planVals()[r.id] || {}) };
  return Object.keys(now).some((k) => (now[k] ?? "") !== (b[k] ?? ""));
}
const planDirty = () => planDraft && JSON.stringify(planDraft) !== JSON.stringify(Object.fromEntries(view.plan.rows.map((r) => [r.id, r.values])));
function markRow(rid) {   // live update of ★ / changed marks without re-rendering (keeps input focus)
  const tr = document.querySelector(`tr[data-row="${CSS.escape(rid)}"]`); if (!tr) return;
  const r = view.plan.rows.find((x) => x.id === rid), v = planVals()[rid] || {};
  tr.querySelectorAll("[data-k]").forEach((el) => el.classList.toggle("userset", el.dataset.k in v));
  tr.classList.toggle("changed", rowChanged(r));
  const n = view.plan.rows.filter(rowChanged).length;
  $("planChanged").textContent = view.plan.built ? `바뀐 행만 반영 (${n})` : "바뀐 행만 반영";
  $("planChanged").disabled = !view.plan.built || !n || !!styleDirty();
  $("planSaveHint").textContent = planDirty() ? "구성표에 저장하지 않은 수정이 있습니다 (제작 버튼을 누르면 함께 저장)" : "";
}
const styleDirty = () => JSON.stringify(selStyle()) !== JSON.stringify(view.style);

function planTable(p) {
  if (!p.rows.length) return `<p class="muted">${p.rows_from === "scenes" ? "3단계 대본이 있어야 장면별 구성표가 채워집니다." : "구성표 없음"}</p>`;
  const head = p.columns.map((c) => `<th>${esc(c.label)}</th>`).join("");
  const body = p.rows.map((r) => {
    const v = planVals()[r.id] || {};
    const cells = p.columns.map((c) => {
      const val = cellVal(r, c.key), cls = c.key in v ? "userset" : "";
      if (c.type === "select") {
        const opts = (c.choices || []).map(([cv, cl]) => `<option value="${esc(cv)}" ${cv === val ? "selected" : ""}>${esc(cl)}</option>`).join("");
        const unknown = val && !(c.choices || []).some(([cv]) => cv === val) ? `<option selected>${esc(val)}</option>` : "";
        return `<td><select class="${cls}" data-k="${esc(c.key)}" onchange="setCell('${esc(r.id)}','${esc(c.key)}',this.value)">${unknown}${opts}</select></td>`;
      }
      const ph = c.placeholder || "(자동)";
      if (r.limit) return `<td><input class="${cls}" data-k="${esc(c.key)}" value="${esc(val)}" placeholder="${esc(ph)}" maxlength="${r.limit}"
        oninput="setCell('${esc(r.id)}','${esc(c.key)}',this.value)"></td>`;
      const lines = Math.min(4, Math.max(2, Math.ceil(String(val).length / 20)));   // show the whole default where possible
      return `<td><textarea class="${cls}" data-k="${esc(c.key)}" rows="${lines}" placeholder="${esc(ph)}"
        oninput="setCell('${esc(r.id)}','${esc(c.key)}',this.value)">${esc(val)}</textarea></td>`;
    }).join("");
    return `<tr data-row="${esc(r.id)}" class="${rowChanged(r) ? "changed" : ""}">
      <th class="rowhead"><b>${esc(r.label)}</b>${r.time ? `<span class="muted"> ${esc(r.time)}</span>` : ""}
        ${r.say ? `<div class="say" title="${esc(r.say)}">${esc(r.say)}</div>` : ""}</th>${cells}
      <td><button class="mini" title="이 행을 기본안으로" onclick="resetRow('${esc(r.id)}')">↺</button></td></tr>`;
  }).join("");
  return `<div class="tablewrap"><table class="plan"><tr><th>장면</th>${head}<th></th></tr>${body}</table></div>`;
}

/* music & beats: one track per project, analysed by tools/beats.py; build prompts snap motion to its beats */

async function uploadMusic(files) {
  const f = files[0]; if (!f) return;
  const r = await fetch(`/api/lectures/${encodeURIComponent(cur)}/upload_music`, { method: "POST",
    headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(f.name) }, body: f });
  if (!r.ok) { toast((await r.json()).error || "업로드 실패"); return; }
  await act("analyze_music", { bpm_hint: $("bpmHint")?.value.trim() || "" });
}

      승인하면 장면 제작이 이 계획을 따릅니다.</p>
    <div class="row"><button onclick="act('make_storyboard',{})">${sb.text ? "스토리보드 다시 만들기" : "스토리보드 만들기 (Claude)"}</button>
      ${sb.text && !sb.approved ? `<button class="ok" onclick="act('approve_storyboard',{})">이 스토리보드 승인</button>` : ""}
      <span class="muted"><code>lectures/${esc(cur)}/storyboard.md</code> — 고칠 점은 파일을 직접 고치거나 구성표 '수정 요청'에 적고 다시 만드세요</span></div>
    ${sb.text ? `<pre style="margin-top:8px;max-height:420px;overflow:auto">${esc(sb.text)}</pre>` : ""}</details>`;
}
/* reference style: link + screenshots → style-ref/brief.md, used by every style's prompt */
function refBox() {
  const r = view.ref;
  const shots = r.images.map((n) => `<figure><img src="/media/${encodeURIComponent(cur)}/style-ref/${encodeURIComponent(n)}?t=${Date.now()}" alt="">
    <figcaption>${esc(n)} <button class="mini" onclick="delRef('${esc(n)}')">✕</button></figcaption></figure>`).join("");
  const ms = r.measure;
  const measureBox = `<div class="refvideo"><h4 style="margin:10px 0 4px">참고 영상 측정 <span class="muted">— 숫자로 재서 효과 사양표·합격 조건의 근거로</span></h4>
    <p class="muted">영상 파일(mp4·mov·webm, 200MB 이하)을 올리면 전환 시점·방식, 실효 fps(스톱모션 여부), 움직임 양, 그레인, 팔레트를 잽니다.
      YouTube 는 먼저 파일로 받아 두세요. 영상과 캡처는 git 에 올라가지 않고 수치만 남습니다.</p>
    <div class="row">${r.video ? `<span>🎞 ${esc(r.video)} <span class="muted">(${r.video_mb}MB)</span> <button class="mini" onclick="delRef('${esc(r.video)}')">✕</button></span>`
      : `<button onclick="$('refVidPick').click()">영상 파일 올리기</button>`}
      <input type="file" id="refVidPick" accept=".mp4,.mov,.webm,.mkv,.m4v" style="display:none" onchange="uploadRef(this.files)">
      <input id="refRange" value="${esc(r.range || "")}" placeholder="구간 (예: 0:00-5:00, 비우면 전체)" style="width:220px">
      <button class="primary" onclick="measureRef()" ${r.video ? "" : "disabled"}>${ms ? "다시 측정" : "측정하기"}</button>
      ${ms && ms.at ? `<span class="muted">${esc(ms.at.replace("T", " "))} 측정</span>` : ""}</div>
    ${ms ? `<div class="gallery">${ms.sheets.map((x) => `<figure><a href="/media/${encodeURIComponent(cur)}/${x}" target="_blank"><img src="/media/${encodeURIComponent(cur)}/${x}?t=${Date.now()}" alt=""></a><figcaption>${esc(x.split("/").pop())}</figcaption></figure>`).join("")}</div>
      <details><summary>측정 스펙 시트 (spec.md)</summary><pre>${esc(ms.spec)}</pre></details>` : ""}</div>`;
  return `<details class="refbox" ${r.url || r.images.length || r.brief || r.video ? "open" : ""}><summary><b>참고 스타일</b> <span class="muted">— 비슷한 느낌으로 만들 영상의 링크·스크린샷·영상 파일</span></summary>
    <p class="muted">예: TED-Ed 애니메이션. 링크만으로는 화면이 거의 읽히지 않는 사이트가 많아 <b>스크린샷 2~3장</b>을 함께 넣으세요.
      Claude가 색·도형·인물 비율·움직임을 <b>스타일 메모</b>로 정리해 장면 제작과 이미지 생성에 반영합니다.
      참고 영상의 캐릭터·장면은 쓰지 않습니다(TED 는 CC BY-NC-ND).</p>
    <div class="row"><input id="refUrl" value="${esc(r.url)}" placeholder="https://www.ted.com/talks/..." style="flex:1">
      <button onclick="saveRef()">링크 저장</button></div>
    <div class="drop" style="margin-top:8px;padding:12px" onclick="$('refPick').click()" ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');uploadRef(event.dataTransfer.files)">
      <b>스크린샷 추가</b> (png·jpg·webp, 여러 장) — 클릭 또는 끌어다 놓기</div>
    <input type="file" id="refPick" accept=".png,.jpg,.jpeg,.webp" multiple style="display:none" onchange="uploadRef(this.files)">
    ${shots ? `<div class="gallery">${shots}</div>` : ""}
    ${measureBox}
    <div class="row" style="margin-top:8px"><button class="primary" onclick="makeBrief()" ${r.url || r.images.length || ms ? "" : "disabled"}>${r.brief ? "스타일 메모 다시 만들기" : "스타일 메모 만들기 (Claude)"}</button>
      ${r.made_at ? `<span class="muted">${esc(r.made_at.replace("T", " "))} 작성 · 장면 제작 지시에 자동 포함</span>` : ""}</div>
    ${r.brief ? `<pre style="margin-top:8px">${esc(r.brief)}</pre>` : ""}</details>`;
}
async function saveRef() { await act("save_ref", { url: $("refUrl").value.trim() }); toast("링크 저장됨"); }
async function uploadRef(files) {
  for (const f of [...files]) {
    const r = await fetch(`/api/lectures/${encodeURIComponent(cur)}/upload_ref`, { method: "POST",
      headers: { "Content-Type": "application/octet-stream", "X-Filename": encodeURIComponent(f.name) }, body: f });
    if (!r.ok) { toast((await r.json()).error || "업로드 실패"); break; }
    if (/\.(mp4|mov|webm|mkv|m4v)$/i.test(f.name)) toast("참고 영상 저장됨 — '측정하기'를 누르세요");
  }
  if ($("refUrl")?.value.trim() && $("refUrl").value.trim() !== view.ref.url) await act("save_ref", { url: $("refUrl").value.trim() });
  await refresh();
}
async function delRef(name) { await act("delete_ref", { name }); }
async function measureRef() {
  await api(`/api/lectures/${encodeURIComponent(cur)}/save_ref`, { url: $("refUrl").value.trim(), range: $("refRange").value.trim() });
  await act("measure_ref", {});
}
async function makeBrief() {
  if ($("refUrl").value.trim() !== view.ref.url) await api(`/api/lectures/${encodeURIComponent(cur)}/save_ref`, { url: $("refUrl").value.trim() });
  await act("make_brief", {});
}
async function savePlan(quiet) {
  if (!planDirty()) { if (!quiet) toast("바뀐 내용이 없습니다"); return; }
  await api(`/api/lectures/${encodeURIComponent(cur)}/save_plan`, { values: planDraft });
  planDraft = null; if (!quiet) { toast("구성표 저장됨"); await refresh(); }
}
async function buildPlan(mode) {
  if (view.paid?.length && !confirm("이번 장면 제작은 유료 크레딧을 씁니다:\n\n- " + view.paid.join("\n- ") +
    "\n\n제작 전에 잔액을 확인하고, 모자라면 가능한 만큼만 만들고 나머지는 무료 방식으로 대신합니다. 진행할까요?")) return;
  await savePlan(true);
  await act("build_visuals", { mode, paid_ok: true });
}
async function saveStyle() {
  const s = styleById(selStyle().id);
  const miss = s.options.filter((o) => o.required && !String(selStyle().options[o.key] ?? "").trim()).map((o) => o.label);
  styleDraft = { ...selStyle() }; planDraft = null;   // the plan table belongs to the saved style
  await act("save_style", styleDraft); styleDraft = null; render();
  toast(miss.length ? `저장됨 — 필수 옵션 비어 있음: ${miss.join(", ")}` : "스타일 저장됨");
}
async function analyzeStyle(id) {
  const j = await api(`/api/styles/${encodeURIComponent(id)}/analyze`, {});
  watchJob(j.job, "claude-style");
}
async function importSkill(fileList) {
  const files = [...fileList].filter((f) => !f.webkitRelativePath.split("/").some((p) => p.startsWith(".") || p === "node_modules"));
  if (!files.length) return;
  const root = files[0].webkitRelativePath.split("/")[0];
  if (!files.some((f) => f.webkitRelativePath === `${root}/SKILL.md`)) return toast("SKILL.md 가 바로 안에 든 스킬 폴더를 고르세요");
  $("job").style.display = "block"; $("jobTitle").textContent = `스킬 가져오기: ${root}`; $("jobStage").textContent = "";
  const bar = $("jobBar").parentElement; bar.className = "pbar";
  let done = 0, failed = null;
  const queue = files.slice();
  const worker = async () => {
    while (queue.length && !failed) {
      const f = queue.shift();
      const r = await fetch("/api/styles/upload", { method: "POST", headers: { "X-Path": encodeURIComponent(f.webkitRelativePath) }, body: f });
      if (!r.ok) { failed = (await r.json()).error || f.webkitRelativePath; break; }
      done++; $("jobBar").style.width = `${(100 * done) / files.length}%`; $("jobPct").textContent = `${Math.round((100 * done) / files.length)}%`;
      $("jobLabel").textContent = `파일 ${done}/${files.length}`;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (failed) { bar.className = "pbar fail"; $("jobLabel").textContent = "실패: " + failed; return; }
  const j = await api("/api/styles/register", { folder: root });
  bar.className = "pbar done"; $("jobTitle").textContent = `스킬 가져오기 완료: ${root}`;
  $("jobLabel").textContent = j.existing ? "이미 등록된 스타일 — 파일만 갱신했습니다" : "기본 manifest 생성 — 'Claude로 옵션 분석'을 실행하세요";
  await refresh(); pickStyle(j.id);
}

/* 6 render */
const QA_LABEL = { pass: "통과", warn: "확인", fail: "문제" };
const QA_NAME = { blank: "빈 화면", freeze: "멈춤", loudness: "음량", readtime: "읽기 시간" };
function qaBadge(q) {
  if (!q) return '<span class="muted">—</span>';
  const cls = { pass: "approved", warn: "qawarn" }[q.overall] || "stale";
  return `<span class="badge ${cls}" title="${esc((q.messages || []).join("\n"))}">${QA_LABEL[q.overall] || esc(q.overall)}</span>`;
}
function refCompareLine(v) {
  const c = v && v.ref_compare;
  if (!c) return "";
  const what = [...(c.metrics || []), c.motion_bins_off ? `시간대별 움직임 ${c.motion_bins_off}구간` : ""].filter(Boolean).join(", ");
  return c.off ? `<p class="muted" style="color:var(--warn)">참고 영상 대조: ±${Math.round(c.tolerance * 100)}% 를 넘은 항목 ${c.off}개 — ${esc(what)} · 상세 renders/${esc(v.file)}.compare.md</p>`
    : `<p class="muted">참고 영상 대조: 모든 항목이 ±${Math.round(c.tolerance * 100)}% 안</p>`;
}
function beatLine(v) {
  const b = v && v.beat_sync;
  if (!b) return "";
  const strict = (styleById(selStyle().id) || {}).narration === "none";
  const color = strict && b.status !== "pass" ? "color:var(--warn)" : "";
  return `<p class="muted" style="${color}">박 맞춤 (${b.bpm} BPM): ${esc(b.message)}${strict ? "" : " — 나레이션 영상은 장면 경계가 나레이션을 따르므로 참고값"} · 상세 renders/${esc(v.file)}.beats.json</p>`;
}
function qaBox(v) {
  return qaBoxInner(v) + refCompareLine(v) + beatLine(v);
}
function qaBoxInner(v) {
  const q = v && v.qa;
  if (!q) return v ? '<p class="muted">자동 검사 기록 없음 (이 기능 전에 만든 버전)</p>' : "";
  const items = Object.keys(QA_NAME).filter((k) => q[k]).map((k) => `${QA_NAME[k]} ${QA_LABEL[q[k]] || q[k]}`).join(" · ");
  if (q.overall === "pass") return `<p class="muted">자동 검사 통과 — ${items} · 음량 −14 LUFS 로 맞춤</p>`;
  return `<details class="warnbox" open><summary>자동 검사: ${QA_LABEL[q.overall]} — 승인 전에 확인하세요</summary><ul>${
    (q.messages || []).map((m) => `<li>${esc(m)}</li>`).join("")}</ul><p class="muted">${items} · 상세: renders/${esc(v.file)}.qa.json</p></details>`;
}
function pRender() {
  const vs = view.renders;
  const last = vs[vs.length - 1];
  return `<div class="card"><h3 style="margin-top:0">렌더 (버전 관리)</h3>
    <div class="row"><input id="rnote" placeholder="이번 버전에서 바뀐 점" style="flex:1"><button class="primary" onclick="act('render',{note:$('rnote').value})">새 버전 렌더</button></div>
    ${last ? `<h3>${esc(last.version)} · ${esc(last.note)}</h3><video controls src="/media/${encodeURIComponent(cur)}/renders/${esc(last.file)}"></video>${qaBox(last)}` : '<p class="muted">아직 렌더 없음</p>'}
    <table><tr><th>버전</th><th>날짜</th><th>커밋</th><th>길이</th><th>검사</th><th>메모</th></tr>${vs.slice().reverse().map((v) =>
      `<tr><td><a href="/media/${encodeURIComponent(cur)}/renders/${esc(v.file)}" target="_blank">${esc(v.version)}</a></td><td>${esc(v.created.slice(0, 10))}</td><td>${esc(v.source.commit)}${v.source.dirty ? "*" : ""}</td><td>${v.seconds ?? ""}s</td><td>${qaBadge(v.qa)}</td><td>${esc(v.note)}</td></tr>`).join("")}</table>
    <p class="muted">* = 커밋 안 된 수정으로 렌더. 다시 만들 수 있게 하려면 먼저 git 커밋.</p>${gate("render")}</div>`;
}

/* 7 publish */
function pPublish() {
  const vs = view.renders, p = view.state.publish || {};
  return `<div class="card"><h3 style="margin-top:0">게시 전 체크리스트</h3>
    ${view.publish_checks.map((c, i) => `<label style="display:flex;gap:8px;color:var(--ink)"><input type="checkbox" class="pc" style="width:auto" ${p.at ? "checked" : ""}> ${esc(c)}</label>`).join("")}
    <label>게시할 버전</label><select id="pver">${vs.slice().reverse().map((v) => `<option ${p.version === v.version ? "selected" : ""}>${esc(v.version)}</option>`).join("")}</select>
    <label>게시 URL (게시 후 기록)</label><input id="purl" value="${esc(p.url)}" placeholder="https://youtu.be/...">
    ${gate("publish")}</div>`;
}

async function approve(s) {
  const body = { stage: s };
  if (s === "narration" && !view.audio && styleById(view.style.id)?.narration === "none") {
    body.review = {}; body.note = "선택한 스타일이 나레이션을 쓰지 않음";   // e.g. fixed-choreography story styles
  } else if (s === "narration") {
    const ids = (view.audio?.scenes || []).filter((x) => x.file).map((x) => x.id);
    if (!view.audio) return toast("나레이션을 먼저 생성하세요");
    const pending = narrPlan()?.pending || [];
    if (pending.length) return toast(`바뀐 장면 ${pending.length}개(${pending.map((x) => x.id).join(", ")})를 먼저 생성해야 승인됩니다`);
    body.review = Object.fromEntries(ids.map((id) => [id, "ok"]));   // kept for the record (lecture.json narration_review)
  }
  if (s === "publish") {
    body.checks = [...document.querySelectorAll(".pc")].map((c) => c.checked);
    body.version = $("pver")?.value; body.url = $("purl")?.value || "";
  }
  await api(`/api/lectures/${encodeURIComponent(cur)}/approve`, body);
  toast(LABEL[s] + " 승인"); const i = view.stages.indexOf(s); stage = view.stages[Math.min(i + 1, 6)]; await refresh();
}

async function act(action, body) {
  const j = await api(`/api/lectures/${encodeURIComponent(cur)}/${action}`, body);
  if (j.job) watchJob(j.job, action); else await refresh();
}
const JOB_NAME = { extract: "텍스트 추출", "claude-script": "대본 초안 (Claude)", narrate: "나레이션 생성",
  "claude-visuals": "장면 제작 (Claude)", snapshot: "스냅샷·미리보기", check: "규칙 검사", render: "렌더",
  "claude-style": "스킬 분석 (Claude)", "claude-brief": "참고 스타일 분석 (Claude)",
  "fish-clone": "Fish Audio 내 목소리 화자 (Claude · MCP)", "qwen-enroll": "로컬 Qwen 목소리 프로필" };
const JOB_STAGE = { extract: "source", "claude-script": "script", narrate: "narration", "claude-visuals": "visuals",
  snapshot: "visuals", check: "visuals", render: "render", "claude-brief": "visuals", "fish-clone": "narration", "qwen-enroll": "narration" };
const fmtSec = (s) => s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`;

function showProgress(j) {
  const p = j.progress || {}, bar = $("jobBar").parentElement;
  const failed = j.status === "failed", running = j.status === "running";
  const indet = running && (p.pct === null || p.pct === undefined);
  bar.className = "pbar" + (indet ? " indet" : "") + (j.status === "done" ? " done" : "") + (failed ? " fail" : "");
  $("jobBar").style.width = indet ? "" : `${p.pct ?? (failed ? 100 : 0)}%`;
  $("jobPct").textContent = indet ? "" : `${Math.round(p.pct ?? 0)}%`;
  const times = [p.elapsed != null && `경과 ${fmtSec(p.elapsed)}`, running && p.eta != null && `남은 시간 약 ${fmtSec(p.eta)}`].filter(Boolean).join(" · ");
  $("jobLabel").textContent = [failed ? "실패 — 로그를 확인하세요" : p.label, times].filter(Boolean).join(" · ");
  const st = JOB_STAGE[j.kind];
  if (st && view) {
    const n = view.stages.filter((s) => status(s) === "approved").length;
    $("jobStage").textContent = `전체 7단계 중 ${view.stages.indexOf(st) + 1}단계 (${LABEL[st].slice(2)}) · 승인 ${n}/7`;
  } else $("jobStage").textContent = "";
}
function watchJob(id, kind) {
  $("job").style.display = "block"; $("jobTitle").textContent = (JOB_NAME[kind] || kind) + " 실행 중…";
  showProgress({ kind, status: "running", progress: {} });
  clearInterval(pollTimer);
  const tick = async () => {
    const j = await (await fetch(`/api/jobs/${id}`)).json();
    $("jobLog").textContent = j.log || ""; $("jobLog").scrollTop = 1e9;
    showProgress(j);
    if (j.status !== "running") {
      clearInterval(pollTimer);
      $("jobTitle").textContent = `${JOB_NAME[j.kind] || j.kind} ${j.status === "done" ? "완료" : "실패"}`;
      if (j.status === "failed") $("jobLog").parentElement.open = true;
      await refresh();
    }
  };
  pollTimer = setInterval(tick, 1500); tick();
}
function hideJob() { $("job").style.display = "none"; }
async function copyPrompt(k) { await navigator.clipboard.writeText(view.prompts[k]); toast("복사됨 — 이 폴더에서 연 Claude Code에 붙여넣기"); }

boot();
</script>
</body>
