<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1020; }
      #bg { position: absolute; inset: 0; z-index: 0; background: radial-gradient(1200px 700px at 70% 20%, #1a2550 0%, #0b1020 60%); }
      #s01, #s02, #s03, #s04, #s05 { z-index: 1; }
      #thread { z-index: 6; }
      #captions { z-index: 10; }
    </style>
  </head>
  <body>
    <!-- timings = build/audio/manifest.json (start/duration per scene) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.32" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="36.32" data-track-index="0"></div>
      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01.html" data-start="0" data-duration="6.56" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02.html" data-start="6.56" data-duration="6.08" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03.html" data-start="12.64" data-duration="7.44" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s04" data-composition-id="s04" data-composition-src="compositions/s04.html" data-start="20.08" data-duration="9.36" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s05" data-composition-id="s05" data-composition-src="compositions/s05.html" data-start="29.44" data-duration="6.88" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- through-element: the amber dot + the s03->s04 wipe band, full length above the scenes -->
      <div id="thread" data-composition-id="thread" data-composition-src="compositions/thread.html" data-start="0" data-duration="36.32" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="36.32" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"></div>
      <audio id="vo" src="assets/voice/narration.wav" data-start="0" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
