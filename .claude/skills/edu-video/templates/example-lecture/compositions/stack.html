<template>
  <style>
    @font-face { font-family: "Pretendard"; font-weight: 400; src: url("assets/fonts/Pretendard-Regular.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
    @font-face { font-family: "Pretendard"; font-weight: 900; src: url("assets/fonts/Pretendard-Black.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; font-family: "Pretendard"; color: #f4f1ea; }
    #stack-title { position: absolute; left: 200px; top: 150px; font-size: 76px; font-weight: 900; opacity: 0; }
    .stack-layer { position: absolute; left: 200px; width: 1120px; height: 180px; border-radius: 26px; padding: 34px 44px; opacity: 0; }
    #stack-l1 { top: 800px; background: #ffb547; color: #0b1020; }
    #stack-l2 { top: 590px; background: #4fd1c5; color: #0b1020; }
    #stack-l3 { top: 380px; background: #ff6b6b; color: #0b1020; }
    .stack-role { font-size: 30px; font-weight: 700; opacity: 0.75; letter-spacing: 0.04em; }
    .stack-name { font-size: 58px; font-weight: 900; margin-top: 4px; }
    .stack-desc { position: absolute; left: 520px; top: 66px; font-size: 34px; font-weight: 700; }
    .stack-star { position: absolute; left: 1380px; width: 360px; font-size: 52px; font-weight: 900; opacity: 0; }
    .stack-star small { display: block; font-size: 28px; color: #8a93b8; font-weight: 700; }
    #stack-s1 { top: 830px; } #stack-s2 { top: 620px; } #stack-s3 { top: 410px; }
  </style>
  <div id="root" data-composition-id="stack" data-width="1920" data-height="1080">
    <div id="stack-title">도구 3개, 층으로 쌓는다</div>
    <div id="stack-l1" class="stack-layer"><div class="stack-role">① 엔진</div><div class="stack-name">Remotion</div><div class="stack-desc">영상을 코드로 만든다</div></div>
    <div id="stack-l2" class="stack-layer"><div class="stack-role">② 그래픽</div><div class="stack-name">HyperFrames</div><div class="stack-desc">HTML·CSS 그대로 MP4로</div></div>
    <div id="stack-l3" class="stack-layer"><div class="stack-role">③ 확장</div><div class="stack-name">OpenMontage</div><div class="stack-desc">스톡·음악·자막 한 번에</div></div>
    <div id="stack-s1" class="stack-star"><small>GitHub ★</small><span id="stack-n1">0</span></div>
    <div id="stack-s2" class="stack-star"><small>GitHub ★</small><span id="stack-n2">0</span></div>
    <div id="stack-s3" class="stack-star"><small>GitHub ★</small><span id="stack-n3">0</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#stack-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
    const stars = [61607, 55979, 62501];
    for (let i = 1; i <= 3; i++) {
      const at = 0.9 + (i - 1) * 3.4;
      tl.fromTo("#stack-l" + i, { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.55, ease: "bounce.out" }, at);
      tl.fromTo("#stack-s" + i, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.4);
      const counter = { v: 0 };
      const el = "#stack-n" + i;
      tl.fromTo(counter, { v: 0 }, {
        v: stars[i - 1], duration: 1.2, ease: "power2.out",
        onUpdate: () => { document.querySelector(el).textContent = Math.round(counter.v).toLocaleString("en-US"); }
      }, at + 0.4);
      // earlier layers dim slightly so the newest one leads
      if (i > 1) tl.to("#stack-l" + (i - 1), { opacity: 0.55, duration: 0.4 }, at);
    }
    tl.to(["#stack-l1", "#stack-l2"], { opacity: 1, duration: 0.4 }, 9.6);
    tl.to("#root", { opacity: 0, duration: 0.35, ease: "power2.in" }, 12.05);
    window.__timelines["stack"] = tl;
  </script>
</template>
